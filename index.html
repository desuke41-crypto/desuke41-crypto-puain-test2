<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="軽自動車限定・市内出張オイル交換サービスのご案内" />
    <title>市内出張オイル交換承ります</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@500&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="flyer">
      <header class="promise">
        <span class="check" aria-hidden="true"></span>
        <p>オイル交換だけじゃない、<em>“安心”</em>と<br class="mobile-break" />話せる<em>“時間”</em>も届けます。</p>
      </header>

      <section class="hero" aria-labelledby="main-title">
        <div class="speech">出張</div>
        <div class="service-area">軽自動車限定<br /><strong>市内</strong></div>
        <div class="car" aria-hidden="true"><i></i><b></b><span></span></div>
        <h1 id="main-title">オイル交換承ります</h1>
      </section>

      <section class="details" aria-label="サービス詳細">
        <p>作業日程：ホワイトボードに記載</p>
        <ul>
          <li>改造車・旧車 不可</li>
          <li>出張型のコミコミ価格</li>
        </ul>
      </section>

      <section class="price" aria-label="料金">
        <p class="main-price"><span>7,000</span>円</p>
        <p class="filter">フィルター交換 ＋<strong>3,000円</strong></p>
      </section>

      <section class="contact">
        <p><span>お問合せ先</span> <a href="tel:09019335000" aria-label="電話番号 090 1933 5000">☎ 090-1933-5000</a></p>
        <small>17時から19時までのご対応になります。時間外は折り返しの<br />ご連絡になります。</small>
        <strong>※車種、年式、走行距離、希望日等お知らせください。</strong>
      </section>

      <footer>
        <p class="importance">エンジンにとってオイル交換は<br /><span>とても重要です。</span></p>
        <p class="recommendation">6ヶ月に一度は交換しましょう。</p>
      </footer>
    </main>
  </body>
</html>
