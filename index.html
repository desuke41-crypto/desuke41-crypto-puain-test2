<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="東京・ソウル・台北の現在の天気と今日の予報を表示する天気サイトです。" />
    <title>天気予報</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&amp;family=Noto+Sans+JP:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="#top" aria-label="天気予報トップへ"><span>d.</span><b>天気予報</b></a>
      <nav aria-label="メインナビゲーション">
        <a class="active" href="#weather">日本・韓国・台湾の天気</a>
      </nav>
    </header>

    <main id="top">
      <section class="hero">
        <div class="hero-copy">
          <p class="kicker">EAST ASIA WEATHER</p>
          <h1>天気<br /><em>予報</em></h1>
          <p class="lead">東京・ソウル・台北の現在の天気と、<br />今日の最高・最低気温や降水確率を表示します。</p>
          <a class="primary-button" href="#weather">3都市の天気を見る <span>↓</span></a>
        </div>
        <div class="hero-art" aria-hidden="true">
          <div class="sun"></div><div class="hill hill-back"></div><div class="hill hill-front"></div>
        </div>
        <p class="scroll-note">SCROLL TO WEATHER <span>↓</span></p>
      </section>

      <section class="weather-section" id="weather" aria-labelledby="weather-title">
        <div class="section-title">
          <div><p class="kicker">EAST ASIA WEATHER</p><h2 id="weather-title">日本・韓国・台湾の天気</h2></div>
          <p>東京、ソウル、台北の現在の天気と<br />今日の予報をお届けします。</p>
        </div>
        <p class="weather-status" id="weather-status" role="status">各都市の天気を読み込んでいます…</p>
        <div class="weather-grid" id="weather-grid" aria-live="polite"></div>
        <p class="weather-credit">天気データ: <a href="https://open-meteo.com/" target="_blank" rel="noreferrer">Open-Meteo ↗</a></p>
      </section>
    </main>

    <footer><a class="logo light" href="#top"><span>d.</span><b>天気予報</b></a><p>Weather data by Open-Meteo</p><p>© 2026 DESUKE41</p></footer>
    <script src="script.js"></script>
  </body>
</html>
