<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ソウル観光スポットを北から南へ並べた位置関係メモです。" />
    <title>ソウル観光ルート | 北から南の位置関係</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="route-card" aria-labelledby="route-title">
      <p class="direction direction-north">【北】</p>
      <h1 id="route-title">ソウル観光スポット位置関係</h1>
      <p class="lead">北から南へ移動するイメージで、主要スポットとホテル周辺を整理しました。</p>

      <ol class="route-map" aria-label="北から南への観光ルート">
        <li class="route-stop">
          <span class="pin">1</span>
          <span class="place">景福宮</span>
        </li>
        <li class="route-stop">
          <span class="pin">2</span>
          <span class="place">西大門刑務所</span>
        </li>
        <li class="route-stop has-branch">
          <span class="pin">3</span>
          <span class="place">明洞</span>
          <span class="branch" aria-label="明洞から東側にNソウルタワー">
            <span class="branch-line"></span>
            <span class="branch-place">Nソウルタワー</span>
          </span>
        </li>
        <li class="route-stop">
          <span class="pin">4</span>
          <span class="place">戦争記念館</span>
        </li>
        <li class="route-stop">
          <span class="pin">5</span>
          <span class="place">梨泰院</span>
        </li>
        <li class="route-stop river">
          <span class="pin">6</span>
          <span class="place">漢江</span>
        </li>
        <li class="route-stop hotel">
          <span class="pin">7</span>
          <span class="place">ホテル（永登浦）</span>
        </li>
        <li class="route-stop">
          <span class="pin">8</span>
          <span class="place">弘大</span>
        </li>
      </ol>

      <p class="direction direction-south">【南】</p>
    </main>
  </body>
</html>
